name: Plugin Auto-PR

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dify CLI
        run: pip install dify-cli

      - name: Package Plugin
        run: dify plugin package ./

      - name: Clone Marketplace Toolkit
        run: |
          gh repo clone langgenius/dify-marketplace-toolkit -- .scripts/
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}

      - name: Run Publish Script
        run: |
          python .scripts/publish.py
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
