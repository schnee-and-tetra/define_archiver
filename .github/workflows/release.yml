name: Plugin Auto-PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Plugin Source
        uses: actions/checkout@v5

      - name: Install Dify Plugin CLI
        run: |
          curl -L \
            https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64 \
            -o dify

          chmod +x dify
          sudo mv dify /usr/local/bin/dify

      - name: Verify Dify CLI
        run: |
          dify --version

      - name: Package Plugin
        run: |
          dify plugin package .

      - name: Read Plugin Metadata
        id: plugin
        run: |
          python3 - <<'PY'
          import os
          import yaml

          with open("manifest.yaml", "r") as f:
              data = yaml.safe_load(f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"author={data['author']}\n")
              f.write(f"name={data['name']}\n")
              f.write(f"version={data['version']}\n")
          PY

      - name: Checkout Marketplace Fork
        uses: actions/checkout@v5
        with:
          repository: schnee-and-tetra/dify-plugins
          token: ${{ secrets.PLUGIN_ACTION }}
          path: marketplace

      - name: Copy Plugin Package
        run: |
          mkdir -p \
            marketplace/${{ steps.plugin.outputs.author }}/${{ steps.plugin.outputs.name }}

          cp \
            *.difypkg \
            marketplace/${{ steps.plugin.outputs.author }}/${{ steps.plugin.outputs.name }}/

      - name: Commit Marketplace Change
        working-directory: marketplace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="add-${{ steps.plugin.outputs.name }}-${{ steps.plugin.outputs.version }}"

          git checkout -B "$BRANCH"

          git add .

          git commit \
            -m "Add ${{ steps.plugin.outputs.name }} plugin" || echo "No changes"

          git push origin "$BRANCH" --force

      - name: Create Pull Request to Dify Official
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          BRANCH="add-${{ steps.plugin.outputs.name }}-${{ steps.plugin.outputs.version }}"

          # 1. 本文を一度ファイルに書き出す
          cat << 'EOF' > pr_body.md
          ## Plugin information
          - **Plugin name**: Define Archiver
          - **Version**: ${{ steps.plugin.outputs.version }}
          - **Source repository**: https://github.com/${{ github.repository }}
          - **Author**: schnee-and-tetra
          - **Contact**: 308144300+schnee-and-tetra@users.noreply.github.com

          ## Submission type
          - [x] New Plugin
          - [ ] Update Existing Plugin

          ## Risk Level
          - [x] Low risk
          - [ ] Medium risk
          - [ ] High risk

          ## What changed
          - Implemented a Dify workflow tool that organizes and packages files into custom folder structures.
          - Supports secure and high-performance archiving formats including `zip`, `tar.gz`, and `tar.zst`.
          - Added strict multi-language support (en_US, ja_JP, zh_Hans, zh_Hant) in the manifest configuration.
          - Configured isolated memory limit (512MB) and storage constraint (1GB) in compliance with Dify Marketplace standards.

          ## Local validation
          - Verified manifest schema validation successfully with the required `contact` field included.
          - Passed local Python execution tests and confirmed compatibility with Dify version 1.5.0+.
          - Confirmed correct compression outputs and directory structures for all supported archive formats.

          ## Security and privacy notes
          - **Filesystem operations**: The plugin performs directory creation and write operations exclusively within the allowed local workspace (`utils/logger.py` and archiver core modules) to safely compress user-specified file hierarchies into portable archives.
          - **Network requests**: The plugin utilizes `httpx.head` (`utils/urls.py`) solely for pre-validating external asset paths or integration URLs safely before processing any batch data.
          EOF

          # 2. PRを作成する（すでに存在しているエラーが出た場合は処理を止めずにメッセージを出力する）
          gh pr create \
            --repo langgenius/dify-plugins \
            --head schnee-and-tetra:"$BRANCH" \
            --base main \
            --title "Add ${{ steps.plugin.outputs.name }} plugin" \
            --body-file pr_body.md || echo "Pull request already exists or could not be created."
