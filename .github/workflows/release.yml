name: Plugin Auto-PR

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dify Plugin CLI
        run: |
          curl -L https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64 \
            -o dify
          chmod +x dify
          sudo mv dify /usr/local/bin/dify

      - name: Verify Dify CLI
        run: |
          dify --version

      - name: Package and Publish Plugin
        uses: langgenius/dify-marketplace-publish-action@main
        with:
          github_token: ${{ secrets.PLUGIN_ACTION }}
